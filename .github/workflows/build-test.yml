name: Build Test

permissions:
  contents: read

on: [pull_request]

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One leg failing should not cancel the other - we want both results.
      fail-fast: false
      matrix:
        # Node 24 only: workspace packages declare engines.node >=24.0.0
        # and the repo runs with engineStrict, so older majors cannot install.
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Configure Git line endings
        if: matrix.os == 'windows-latest'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Ensure npm satisfies devEngines (>=11.6.0)
        run: npm i -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Build Packages
        run: npm run build
