name: unit tests

permissions:
  contents: read

on: [pull_request]

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Ensure npm satisfies devEngines (>=11.6.0)
        run: npm i -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test
